name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:

  release:
    runs-on: windows-2022

    env:
      TAG: ${{ github.ref_name }}
      PACKAGE_DIR: ReflavorRP/bin/x64/Release/ReflavorRP

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    # v0.1.0 -> 0.1.0
    - name: Build
      run: dotnet build --configuration Release -p:Version=$($env:TAG.TrimStart('v'))

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create $env:TAG "$env:PACKAGE_DIR/latest.zip" --title $env:TAG --generate-notes

    # repo.json is what people add under Custom Plugin Repositories
    - name: Update repo.json on master
      run: |
        Copy-Item "$env:PACKAGE_DIR/ReflavorRP.json" "$env:RUNNER_TEMP/manifest.json"
        git fetch origin master
        git checkout master

        $zip = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/latest.zip"
        $manifest = Get-Content "$env:RUNNER_TEMP/manifest.json" -Raw | ConvertFrom-Json
        $manifest | Add-Member DownloadLinkInstall $zip
        $manifest | Add-Member DownloadLinkUpdate $zip
        $manifest | Add-Member DownloadLinkTesting $zip
        $manifest | Add-Member LastUpdate ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
        ConvertTo-Json -InputObject @($manifest) -Depth 5 | Set-Content repo.json -Encoding utf8

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add repo.json
        git commit -m "Update repo.json for $env:TAG"
        git push origin master
