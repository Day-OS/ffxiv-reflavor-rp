  <text x="112" y="73" fill="url(#lettering)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8">ReflavorRP</text>
  <text x="115" y="96" fill="#9C79B9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3">FINAL FANTASY XIV · ROLEPLAY</text>

  <path d="M112 110h394" stroke="url(#rule)"/>
